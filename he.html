  if(o.cur){const p=SLOTS[fr.length%12],sh=fr.length>=12;out+=fruit(+f1(cx+p[0]*k+(sh?6:0)),+f1(cy+p[1]*k-(sh?10:0)),'p','','')}
  if(o.bird){const x=+f1(cx+38*k),y=+f1(cy-40*k);
    out+=`<g class="bird" data-act="bird" tabindex="0" role="button" aria-label="ציפור: לחצו כדי שתאמר משהו"><path d="M${x-8} ${y}l-7-3 1.5 6Z" fill="#35506e"/><ellipse cx="${x}" cy="${y}" rx="8.5" ry="6.2" fill="#f2c14e"/><path d="M${x-7} ${y-1}q6-7 13-1q-6 5-13 1Z" fill="#4a7fb5"/><circle cx="${x+7}" cy="${y-4.5}" r="4.4" fill="#35506e"/><circle cx="${x+8.5}" cy="${y-5.3}" r="1.1" fill="#fff"/><path d="M${x+11} ${y-4.6}l4.5 1-4.5 1.8Z" fill="#e8743b"/></g>`}
  out+='</g>';
  [[34,150,'#f7a1c4'],[204,128,'#8fc7ff'],[190,186,'#ffd166']].slice(0,bf).forEach((b,i)=>out+=`<g class="fly" style="animation-delay:-${i*2.5}s"><g transform="translate(${b[0]} ${b[1]})"><ellipse cx="-3.2" rx="3.6" ry="5" fill="${b[2]}"/><ellipse cx="3.2" rx="3.6" ry="5" fill="${b[2]}"/><path d="M0-4.5v9" stroke="#3b3024" stroke-width="1.2"/></g></g>`);
  return out+'</svg>';
}

/* ---------- voice ---------- */
const canSay=()=>!ttsOff&&(!!tts||('speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'));
const sayBtn=t=>canSay()?`<button data-act="say" data-text="${esc(t)}">🔊 להאזין</button>`:'';
function say(text,btn){
  const reset=()=>{speaking=false;$$('[data-act=say]').forEach(b=>b.textContent='🔊 להאזין')};
  if(speaking||!text){if(tts)tts.stop().catch(()=>{});else try{speechSynthesis.cancel()}catch(e){}reset();return}
  speaking=true;if(btn)btn.textContent='⏹ לעצור';
  if(tts)tts.speak(text,{language:TTS_LANG,rate:.9}).then(reset,e=>{reset();if(e&&(e.code==='not_granted'||e.code==='unavailable')){ttsOff=true;$$('[data-act=say]').forEach(b=>b.remove())}});
  else try{const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH;u.rate=.9;u.onend=u.onerror=reset;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){reset()}
}

game('leaves','מיקום העלים','mem','זכרו את המשבצות עם העלים וסמנו אותן מהזיכרון.',
 'על הלוח יופיעו לרגע משבצות ירוקות. כשהן ייכבו, סמנו את אותן משבצות. שלושה סבבים.',c=>{
  const [n,k]=[[3,3],[4,4],[4,6],[5,7],[5,9]][c.lvl];let round=0,hits=0;const R=3;
  const next=()=>{
    if(round===R)return c.done({score:Math.round(hits/(R*k)*100),err:R*k-hits});
    round++;const set=new Set(pick(range(n*n),k)),chosen=new Set();
    c.box.innerHTML=`<p class="hint">סבב ${round} מתוך ${R}. זכרו היכן העלים.</p><div class="grid" style="--n:${n}">${range(n*n).map(i=>`<button class="cell${set.has(i)?' on':''}" data-i="${i}" disabled aria-label="משבצת ${i+1}"></button>`).join('')}</div>`;
    c.later(()=>{
      $('.hint',c.box).textContent=`סמנו ${k} משבצות שבהן היו עלים.`;
      $$('.cell',c.box).forEach(b=>{b.classList.remove('on');b.disabled=false;b.onclick=()=>{
        const i=+b.dataset.i;if(chosen.has(i))return;chosen.add(i);b.classList.add('pick');
        if(chosen.size===k){
          $$('.cell',c.box).forEach(x=>{const j=+x.dataset.i;x.disabled=true;if(set.has(j))x.classList.add('on');
            if(chosen.has(j)){if(set.has(j)){hits++;x.classList.add('good')}else x.classList.add('bad')}});
          c.later(next,1500);
        }}});
    },1300+k*300);

game('seq','רצף','mem','חזרו על הסדר שבו נדלקו האורות.',
 'האורות יידלקו בזה אחר זה. אחר כך לחצו עליהם באותו סדר. שני סבבים.',c=>{
  const pads=[4,4,6,6,9][c.lvl],len=[3,4,5,6,7][c.lvl],cols=pads===4?2:3,R=2;let round=0,good=0;
  const next=()=>{
    if(round===R)return c.done({score:Math.round(good/(R*len)*100),err:R*len-good});
    round++;const seq=range(len).map(()=>rnd(pads));let pos=0,open=false;
    c.box.innerHTML=`<p class="hint">סבב ${round} מתוך ${R}. הסתכלו היטב.</p><div class="grid" style="--n:${cols}">${range(pads).map(i=>`<button class="pad" data-i="${i}" aria-label="אור ${i+1}"></button>`).join('')}</div>`;
    const ps=$$('.pad',c.box);
    const flash=(i,ms)=>{ps[i].classList.add('lit');c.later(()=>ps[i].classList.remove('lit'),ms)};
    seq.forEach((p,i)=>c.later(()=>flash(p,450),600+i*750));
    c.later(()=>{open=true;$('.hint',c.box).textContent='עכשיו חזרו על הסדר.'},600+len*750);
    ps.forEach(b=>b.onclick=()=>{
      if(!open)return;const i=+b.dataset.i;

function trials(c,T,limit,make){
  let i=0,good=0,lock=false,tm=null;
  const next=()=>{
    if(i===T)return c.done({score:Math.round(good/T*100),err:T-good});
    i++;lock=false;const t=make(i,T);
    const bar=$('.bar i',c.box);
    if(bar){bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${limit}ms linear`;bar.style.width='0%'}
    clearTimeout(tm);tm=setTimeout(()=>{if(!lock)t.answer(null)},limit);
    t.answer=v=>{if(lock)return;lock=true;clearTimeout(tm);const ok=v===t.right;if(ok)good++;t.show(ok,v);c.later(next,ok?450:1100)};
    t.bind(v=>t.answer(v));
  };
  c.stop=()=>clearTimeout(tm);next();
}

function mkSeries(l){
  const a=1+rnd(9);let seq,rule;const gen=f=>range(6).map(f);
  if(l===0){const d=2+rnd(4);seq=gen(i=>a+d*i);rule=`כל מספר ב- ${d} גדול מהמספר הקודם`}
  else if(l===1){const d=3+rnd(7),s=60+rnd(30);seq=gen(i=>s-d*i);rule=`כל מספר ב- ${d} קטן מהמספר הקודם`}
  else if(l===2){if(rnd(2)){const m=2+rnd(2),b=1+rnd(4);seq=gen(i=>b*m**i);rule=`כל מספר גדול פי ${m} מהמספר הקודם`}
    else{const p=2+rnd(3),q=6+rnd(4);seq=gen(i=>a+Math.ceil(i/2)*p+Math.floor(i/2)*q);rule=`מוסיפים לסירוגין ${p} וגם ${q}`}}
  else if(l===3){if(rnd(2)){seq=gen(i=>a+i*(i+1)/2);rule='מוסיפים 1, אחר כך 2, אחר כך 3 וכן הלאה'}
    else{const b=1+rnd(5);seq=gen(i=>(i+b)**2);rule=`אלה ריבועים של מספרים עוקבים, החל מ- ${b}×${b}`}}
  else{const v=rnd(3);
    if(v===0){seq=[a,a+1+rnd(4)];while(seq.length<6)seq.push(seq.at(-1)+seq.at(-2));rule='כל מספר הוא סכום שני המספרים שלפניו'}
    else if(v===1){seq=[a];while(seq.length<6)seq.push(seq.at(-1)*2+1);rule='כופלים את המספר ב-2 ומוסיפים 1'}
    else{seq=[a+4];while(seq.length<6)seq.push(seq.length%2?seq.at(-1)*2:seq.at(-1)-3);rule='לסירוגין: כופלים ב-2, אחר כך מחסרים 3'}}
  const ans=seq[5],opts=new Set([ans]);
  for(const d of shuffle([-3,-2,-1,1,2,3,4,5,-5,10,-10])){if(opts.size===4)break;if(ans+d>0)opts.add(ans+d)}
  return{seq:seq.slice(0,5),ans,rule,opts:shuffle([...opts])};
}
game('series','סדרת מספרים','log','מצאו את החוקיות של הסדרה ובחרו את המספר הבא.',
 'בדקו איך המספרים משתנים ובחרו את המספר שצריך לבוא אחריהם. הסדרה נקראת משמאל לימין. חמש סדרות. אחרי טעות נציג את החוקיות.',c=>{
  const R=5;let round=0,good=0;const missed=[];
  const next=()=>{
    if(round===R)return c.done({score:Math.round(good/R*100),err:R-good,explain:missed.length?missed.join(' · '):''});
    round++;const q=mkSeries(c.lvl);
    c.box.innerHTML=`<p class="hint">סדרה ${round} מתוך ${R}. מהו המספר הבא?</p><div class="stim">${q.seq.join('  ')}  ?</div><div class="opts">${q.opts.map(x=>`<button data-v="${x}">${x}</button>`).join('')}</div><p class="note" hidden></p>`;
    $$('.opts button',c.box).forEach(b=>b.onclick=()=>{
      $$('.opts button',c.box).forEach(x=>{x.disabled=true;if(+x.dataset.v===q.ans)x.classList.add('good')});
      if(+b.dataset.v===q.ans){good++;c.later(next,800)}
      else{b.classList.add('bad');missed.push(`${q.seq.join(', ')}, ${q.ans}: ${q.rule}`);
        const n=$('.note',c.box);n.hidden=false;n.innerHTML=`החוקיות: ${esc(q.rule)}. <button data-go>הלאה</button>`;$('[data-go]',n).onclick=next}
    });
  };next();
});

const WMOVES=[['למלא את A',(x,y,a,b)=>[a,y]],['למלא את B',(x,y,a,b)=>[x,b]],
  ['למזוג A → B',(x,y,a,b)=>{const t=Math.min(x,b-y);return[x-t,y+t]}],['למזוג B → A',(x,y,a,b)=>{const t=Math.min(y,a-x);return[x+t,y-t]}],
  ['לרוקן את A',(x,y)=>[0,y]],['לרוקן את B',(x,y)=>[x,0]]];
function waterSolve(a,b,t){
  const seen=new Map([['0,0',null]]),q=[[0,0]];
  while(q.length){const [x,y]=q.shift();
    if(x===t||y===t){const path=[];let k=x+','+y;while(seen.get(k)){const p=seen.get(k);path.unshift(p.name);k=p.from}return path}
    WMOVES.forEach(([name,f])=>{const [nx,ny]=f(x,y,a,b),k=nx+','+ny;if(!seen.has(k)){seen.set(k,{name,from:x+','+y});q.push([nx,ny])}})}
  return null;
}
game('water','גן המים','log','מדדו את כמות המים הדרושה בעזרת שני משפכים.',
 'אפשר למלא את המשפכים, למזוג מאחד לשני ולרוקן אותם. השיגו באחד המשפכים את מספר הליטרים הדרוש לפני שייגמרו המהלכים.',c=>{
  const [a,b,t,slack]=[[3,5,1,4],[3,5,4,3],[4,7,5,3],[5,8,6,2],[7,11,6,2]][c.lvl];
  const sol=waterSolve(a,b,t),max=sol.length+slack;let x=0,y=0,used=0;const H=l=>40+l*14;

function mkSudoku(k){

  const count=a=>{const i=a.indexOf(0);if(i<0)return 1;let n=0;const r=i>>2,cc=i&3;
    for(let v=1;v<=4&&n<2;v++){let ok=true;for(let j=0;j<16;j++)if(a[j]===v&&((j>>2)===r||(j&3)===cc||((j>>3)===(r>>1)&&((j&3)>>1)===(cc>>1)))){ok=false;break}
      if(ok){a[i]=v;n+=count(a);a[i]=0}}return n};
  for(const i of shuffle(range(16))){if(puz.filter(v=>!v).length>=k)break;const v=puz[i];puz[i]=0;if(count([...puz])!==1)puz[i]=v}

function markDay(){if(S.lastDay!==DAY()){S.days++;S.lastDay=DAY()}}
function finish(r){

  const d=Math.max(1,Math.round((Date.now()-G.t0)/1000)),ok=r.score>=60,id=G.g.id;
  if(G.trial){G.res=Object.assign({d,ok,trial:1,msg:'סבב הניסיון הסתיים. עכשיו אפשר לשחק באמת.'},r);sfx('tap');render();return}
  S.hist.push({g:id,l:G.lvl,at:G.t0,d,s:r.score,ok});if(S.hist.length>150)S.hist=S.hist.slice(-150);

}

let actx=null;
function sfx(k){
  if(getUI().mute)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const n=actx.currentTime;
    (({ok:[[523,0],[659,.12],[784,.24]],bad:[[247,0],[208,.16]],pop:[[880,0],[1175,.08]],tap:[[1320,0],[1568,.07],[1320,.14]]})[k]||[]).forEach(([f,t])=>{
      const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(.08,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+.3);
      o.connect(g);g.connect(actx.destination);o.start(n+t);o.stop(n+t+.32)});
  }catch(e){}
}
function streak(st){
  const ds=new Set((Array.isArray(st.hist)?st.hist:[]).filter(h=>h.s!=null).map(h=>dayOf(h.at)));let n=0,t=Date.now();
  if(!ds.has(dayOf(t)))t-=864e5;while(ds.has(dayOf(t))){n++;t-=864e5}return n;
}

    body=all.length?`<div class="scroll"><table><thead><tr><th>מתי</th><th>משתתף</th><th>תרגיל</th><th>רמה</th><th>תוצאה</th></tr></thead><tbody>${all.map(([p,x])=>`<tr><td>${when(x.at)}</td><td>${esc(p.nick||'בלי שם')}</td><td>${esc(gname(x.g))}</td><td>${x.l+1}</td><td>${x.s==null?'לא הושלם':x.s+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">עדיין לא היו תרגולים.</p>';

  csv(){copy(['משתתף;היום;שבוע;חודש;תפוחים;הביקור האחרון'].concat(people.map(p=>{const s=pstat(p);return[String(p.nick||'').replace(/;/g,','),s.today,s.week,s.month,+p.apples||0,p.seen?new Date(p.seen).toISOString():''].join(';')})).join('\n'))}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target)}
  if(e.key==='Enter'&&e.target.id==='nick')ACT.plant();if(e.key==='Enter'&&e.target.id==='apass')ACT.alogin()});
document.addEventListener('input',e=>{if(e.target.dataset.in==='word'){wordDraft=e.target.value;return}
  if(e.target.dataset.in==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{const k=e.target.dataset.in;if(!k||k==='search'||k==='word')return;
  if(k==='mode'){await setMode(e.target.value);render()}
  if(k==='style'){S.style=+e.target.value;save()}
  if(k==='hidden'){S.hidden=e.target.checked;save()}
  if(k==='big'||k==='still'||k==='mute'){const ui=getUI();ui[k]=e.target.checked;lsSet('ng_ui',JSON.stringify(ui));applyUI(ui)}
});
const h0=location.hash.slice(1);route=ROUTES[h0]?h0:'garden';render();
init().catch(()=>{ready=true;render()});
</script>
</body>
