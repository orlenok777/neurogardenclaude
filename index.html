<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НейроСад 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm warm column; the living scene is the only loud element, cards stay quiet. */
:root{
  --bg:#f7f1e3; --card:#fffdf6; --ink:#2a2418; --mut:#655c4b; --line:#e3d9c2;
  --leaf:#2f7d4f; --onleaf:#ffffff; --apple:#c8372d; --sun:#f0a92b;
  --sky1:#bfe3f2; --sky2:#fdf3d6; --soil:#a9c77f; --ok:#2f7d4f;
  --t-mem:#fbe3d6; --t-att:#fdeebb; --t-log:#d9ecf7; --t-spa:#e2f0d4;
  --display:"Yeseva One", Georgia, "Times New Roman", serif;
  --body:"Onest", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150f; --card:#221f17; --ink:#f1eadb; --mut:#b8ae9a; --line:#3b3629;
  --leaf:#6cc48c; --onleaf:#10200f; --apple:#ef6a5e; --sun:#f2c14e;
  --sky1:#1b2f3d; --sky2:#2a2a22; --soil:#34502f; --ok:#6cc48c;
  --t-mem:#4a2f25; --t-att:#4a4020; --t-log:#223a48; --t-spa:#2d4027; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17150f; --card:#221f17; --ink:#f1eadb; --mut:#b8ae9a; --line:#3b3629;
  --leaf:#6cc48c; --onleaf:#10200f; --apple:#ef6a5e; --sun:#f2c14e;
  --sky1:#1b2f3d; --sky2:#2a2a22; --soil:#34502f; --ok:#6cc48c;
  --t-mem:#4a2f25; --t-att:#4a4020; --t-log:#223a48; --t-spa:#2d4027; color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:19px}
html.big{font-size:23px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{padding:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mut{color:var(--mut)} .small{font-size:.85rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
nav a{flex:none;padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:.9rem}
nav a[aria-current="page"]{background:var(--leaf);color:var(--onleaf);border-color:var(--leaf)}
main{display:flex;flex-direction:column;gap:16px;padding-bottom:32px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;font-weight:500;min-height:48px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--leaf);color:var(--onleaf);border-color:var(--leaf)}
button.danger{border-color:var(--apple);color:var(--apple)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input[type=text],select{font:inherit;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
label{font-weight:500}
.scene{border-radius:18px;background:linear-gradient(var(--sky1),var(--sky2) 70%);position:relative;overflow:hidden;display:flex;justify-content:center;padding:10px 0 0;border:1.5px solid var(--line)}
.scene::before{content:"";position:absolute;right:9%;top:16px;width:54px;height:54px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px color-mix(in srgb,var(--sun) 22%,transparent)}
.scene svg{width:min(100%,340px);height:auto;position:relative}
svg .crown{transform-origin:100px 205px;animation:sway 5s ease-in-out infinite alternate}
svg .apple{cursor:pointer}
svg .apple.new{animation:pop .9s ease-out}
@keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
@keyframes pop{0%{transform:scale(.1)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
svg .apple{transform-box:fill-box;transform-origin:center}
.still svg .crown,.still svg .apple.new,.still .glow{animation:none}
@media (prefers-reduced-motion:reduce){svg .crown,svg .apple.new,.glow{animation:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--bg);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:.85rem}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border-radius:14px;background:var(--bg);flex-wrap:wrap}
.item>div{flex:1 1 200px;min-width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;border:1.5px solid var(--line);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok)} .pill.play{background:var(--apple);border-color:var(--apple);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:48px;padding:8px 12px}
.chips button[aria-pressed="true"]{background:var(--leaf);color:var(--onleaf);border-color:var(--leaf)}
.hint{font-weight:500;min-height:1.5em}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;width:min(100%,calc(var(--n)*78px));margin:0 auto}
.cell{aspect-ratio:1;min-height:0;padding:0;border-radius:12px;font-size:1.15rem;font-weight:700;position:relative}
.cell.on{background:var(--leaf);border-color:var(--leaf);color:var(--onleaf)}
.cell.pick{border-color:var(--ink);border-width:3px}
.cell.done{opacity:.35}
.good{outline:4px solid var(--ok)} .bad{outline:4px solid var(--apple)}
.cell.good::after{content:"✓"} .cell.bad::after{content:"✕"}
.pad{aspect-ratio:1;border-radius:50%;min-height:0;padding:0;background:color-mix(in srgb,var(--leaf) 22%,var(--card))}
.pad.lit{background:var(--sun);border-color:var(--sun);transform:scale(1.06)}
.emo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:2.2rem;min-height:3.4rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts button{font-size:1.15rem}
.opts.emoji button{font-size:2rem}
.stim{background:#17211b;border-radius:16px;padding:26px 10px;text-align:center;font-size:2.4rem;font-weight:700;letter-spacing:.06em;color:#f2f6f2;min-height:5.2rem}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:100%}
.jugs{display:flex;gap:28px;justify-content:center;align-items:flex-end}
.jug{width:92px;border:3px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:var(--bg)}
.jug i{position:absolute;left:0;right:0;bottom:0;background:#4aa3d8;transition:height .35s}
.still .jug i{transition:none}
.jugcap{text-align:center;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:calc(var(--n)*26px);margin:0 auto}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.mini i.f{background:var(--leaf)}
.mirror{display:flex;gap:14px;justify-content:center;align-items:center}
.mirror .axis{align-self:stretch;border-left:3px dashed var(--mut)}
.mirror .q{font-family:var(--display);font-size:2rem;width:78px;text-align:center}
.trees{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:16px;background:linear-gradient(var(--sky1),var(--sky2));border:1.5px solid var(--line);min-height:0;text-align:center;color:var(--ink)}
.tcard svg{width:100%;height:auto}
.tcard b{font-weight:700;overflow-wrap:anywhere}
.tcard.glow{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 45%,transparent);animation:glow 1.6s ease-in-out infinite alternate}
.tcard[aria-pressed="true"]{border-color:var(--ink)}
@keyframes glow{to{box-shadow:0 0 0 9px color-mix(in srgb,var(--sun) 22%,transparent)}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500}
.note{border-left:4px solid var(--sun);padding:8px 12px;background:var(--bg);border-radius:0 12px 12px 0}
fieldset{border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--bg)}
.radio input{width:22px;height:22px;margin-top:3px;flex:none}
footer{color:var(--mut);font-size:.85rem;padding:0 0 28px}

.scene{align-items:flex-end;min-height:330px;padding:44px 0 0}
.scene::before{display:none}
.scene svg{width:min(78%,300px)}
.scene svg.back{position:absolute;inset:0;width:100%;height:100%}
.cloud g{animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}
.still .cloud g{animation:none}
@media (prefers-reduced-motion:reduce){.cloud g{animation:none}}
.illo{width:72px;height:72px;flex:none;border-radius:18px;padding:5px;background:var(--t-mem)}
.illo.att{background:var(--t-att)} .illo.log{background:var(--t-log)} .illo.spa{background:var(--t-spa)}
.illo.xl{width:104px;height:104px}
.item>.illo+div{flex:1 1 150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:12px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;min-height:66px;line-height:1.2}
.cal small{font-weight:400;color:var(--mut);font-size:.7rem}
.cal i{font-style:normal;font-size:.8rem}
.cal .on{background:var(--leaf);color:var(--onleaf)} .cal .on small{color:inherit}
.cal .now{outline:3px solid var(--sun);outline-offset:1px}
.word{padding:12px 14px;border-radius:16px 16px 16px 4px;background:var(--bg);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.word p{flex:1 1 200px;overflow-wrap:anywhere}
.word button{min-height:40px;padding:6px 12px;font-size:.85rem}
#word{flex:1 1 220px}

.scene svg.tree{width:min(88%,350px)}
svg.tree .crown{transform-origin:120px 232px}
svg.tree [data-act]{cursor:pointer}
.crown.shake{animation:shake .65s}
@keyframes shake{20%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}80%{transform:rotate(-2deg)}}
.apple.pulse{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.25)}}
.apple .unripe{animation:ripen 2.4s ease-out forwards}
@keyframes ripen{to{opacity:0}}
.bird{transform-box:fill-box;transform-origin:center bottom;animation:bob 1.3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px) rotate(-5deg)}}
.fly{animation:flutter 8s ease-in-out infinite alternate}
@keyframes flutter{25%{transform:translate(14px,-18px)}50%{transform:translate(-8px,-30px)}75%{transform:translate(18px,-8px)}100%{transform:translate(0,-14px)}}
.fall{position:absolute;top:32%;width:14px;height:8px;border-radius:0 80% 0 80%;background:#6fb85f;animation:fall 2.2s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),230px) rotate(320deg);opacity:0}}
.drop{position:absolute;top:6%;width:3px;height:15px;border-radius:3px;background:#6db3ff;animation:rain 1s linear forwards;pointer-events:none}
@keyframes rain{to{transform:translateY(260px);opacity:0}}
.still .apple.pulse,.still .bird,.still .fly,.still .crown.shake,.still .apple .unripe{animation:none}
.still .apple .unripe{opacity:0}
@media (prefers-reduced-motion:reduce){.apple.pulse,.bird,.fly,.crown.shake,.apple .unripe{animation:none}.apple .unripe{opacity:0}}
.bubble{position:absolute;left:5%;right:5%;top:10px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;border:1.5px solid var(--line);z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bubble button,[data-act=say]{min-height:44px;padding:6px 14px}
.badges .pill{font-size:.85rem;padding:6px 12px;color:var(--mut)}
.badges .pill.got{background:var(--leaf);color:var(--onleaf);border-color:var(--leaf)}
.cell{display:flex;align-items:center;justify-content:center}
span.cell{border:1.5px solid var(--line);background:var(--card)}
.cell.face{font-size:1.5rem}
.cell.given{background:var(--bg)}
.cell.given:disabled,.cell.on:disabled{opacity:1}
.sud .cell:nth-child(4n+2){margin-right:8px}
.sud .cell:nth-child(n+5):nth-child(-n+8){margin-bottom:8px}
.emo.words span{display:flex;flex-direction:column;align-items:center;font-size:2rem;line-height:1.2}
.emo small{font-size:.8rem}
.field{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:1.7rem;background:var(--bg);border-radius:14px;padding:12px}
.opts button[aria-pressed="true"]{border-color:var(--ink);border-width:3px;background:var(--t-att)}
.opts button{display:flex;align-items:center;justify-content:center;gap:8px}
.mini.glow i.f{background:var(--sun)}
h3{margin-top:6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gRed" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a70"/><stop offset=".55" stop-color="#dc3b2c"/><stop offset="1" stop-color="#9f2419"/></radialGradient>
<radialGradient id="gGreen" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e2f39a"/><stop offset=".55" stop-color="#a3cb45"/><stop offset="1" stop-color="#6f9a25"/></radialGradient>
<linearGradient id="gTrunk" x1="0" x2="1"><stop offset="0" stop-color="#6b4a2f"/><stop offset=".5" stop-color="#916846"/><stop offset="1" stop-color="#5a3d26"/></linearGradient>
</defs></svg>
<div class="wrap">
  <header class="top">
    <div class="row between">
      <div><h1>НейроСад</h1><p class="mut small">Маленькие шаги. Каждый день.</p></div>
      <button id="aplus" data-act="big" aria-pressed="false" aria-label="Крупный текст">A+</button>
    </div>
  </header>
  <nav id="nav" aria-label="Разделы"></nav>
  <main id="main"><section class="card"><p>Открываем сад…</p></section></main>
  <footer>Инициатива Романа Левингарда · Бесплатно, без подписки · Практика внимания и памяти. Не диагностика и не лечение.</footer>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const range=n=>[...Array(n).keys()];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,k)=>shuffle(a).slice(0,k);
const dayOf=t=>new Date(t).toLocaleDateString('sv');
const DAY=()=>dayOf(Date.now());
const hm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
const dm=t=>new Date(t).toLocaleDateString('ru',{day:'numeric',month:'short'});
const when=t=>!t?'—':(dayOf(t)===DAY()?'сегодня, '+hm(t):dm(t)+', '+hm(t));
const dur=s=>s<60?s+' с':Math.floor(s/60)+' мин '+(s%60)+' с';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);

/* ---------- state ---------- */
const blank=()=>({nick:'',style:0,hidden:false,apples:0,flowers:0,lastVisit:'',days:0,lastDay:'',sec:0,cur:null,hist:[],lv:{},seen:0,water:'',waters:0});
let S=blank(), mode='device', ready=false, db=null, user=null, room=null, uid=null, isOwner=false, accountOK=false;
let route='garden', G=null, notice='', newApple=false, appleSel=null;
let people=[], names={}, online=new Set(), trees=[], adminTab='live', sel=null, confirmDel=null, search='';
let saving=false, dirty=false, lastTree='';
let words=[], wordDraft='', hereN=0, wordMsg='';
let tts=null, ttsOff=false, speaking=false, bubble='', cheer=null, cheerMsg='', catF='all';
const typing=()=>document.activeElement&&['word','q','cheer'].includes(document.activeElement.id);

function housekeeping(){
  if(S.cur){S.hist.push({g:S.cur.g,l:S.cur.l,at:S.cur.at,d:0,s:null,ok:false});S.cur=null}
  if(S.lastVisit!==DAY()){S.flowers++;S.lastVisit=DAY()}
  S.seen=Date.now();
}
async function save(){
  if(mode==='nosave'||!S.nick)return;
  if(mode==='device'){lsSet('ng_state',JSON.stringify(S));return}
  dirty=true;if(saving)return;saving=true;
  while(dirty){
    dirty=false;
    try{
      await db.doc('activity/'+uid).set(JSON.parse(JSON.stringify(S)));
      const t=S.hidden?'hidden':JSON.stringify({nick:S.nick,style:S.style,apples:S.apples,flowers:S.flowers,waters:S.waters||0});
      if(t!==lastTree){
        if(S.hidden)await db.doc('trees/'+uid).delete();else await db.doc('trees/'+uid).set(JSON.parse(t));
        lastTree=t;
      }
    }catch(e){
      if(e&&e.code==='invalid_argument'){
        mode='device';accountOK=false;lsSet('ng_mode','device');lsSet('ng_state',JSON.stringify(S));
        notice='Сохранение в аккаунте недоступно при вашем уровне доступа к странице. Сад сохраняется на этом устройстве.';
      }else notice='Не удалось сохранить результат в аккаунте. Проверьте интернет: следующая игра повторит сохранение.';
      if(route!=='play'||!G||!G.active)render();
      break;
    }
  }
  saving=false;
}
async function setMode(m){
  mode=m;lsSet('ng_mode',m);lastTree='';
  if(m==='account'){
    try{const snap=await withTimeout(db.doc('activity/'+uid).get(),10000);
      S=snap.exists?Object.assign(blank(),JSON.parse(JSON.stringify(snap.data()))):blank();
    }catch(e){mode='device';notice='Не удалось связаться с хранилищем аккаунта. Пока сад сохраняется на этом устройстве.';}
  }
  if(mode==='device'){let o={};try{o=JSON.parse(lsGet('ng_state')||'{}')}catch(e){}S=Object.assign(blank(),o)}
  if(mode==='nosave')S=blank();
  if(!Array.isArray(S.hist))S.hist=[];if(!S.lv||typeof S.lv!=='object')S.lv={};
  housekeeping();save();
  if(room)room.presence({acc:mode==='account'&&S.nick?1:null}).catch(()=>{});
}
async function init(){
  const ui=JSON.parse(lsGet('ng_ui')||'{}');applyUI(ui);
  const c=window.claude;
  if(c&&c.use){
    const get=n=>c.use(n).catch(()=>null);
    [db,user,room,tts]=await Promise.all([get('db'),get('user'),get('room'),get('tts')]);
  }
  if(user){uid=await user.id();isOwner=await user.isOwner()}
  accountOK=!!(db&&uid);
  let m=lsGet('ng_mode');
  if(!['account','device','nosave'].includes(m)||(m==='account'&&!accountOK))m=accountOK?'account':'device';
  await setMode(m);
  if(db){
    if(uid)db.doc('cheers/'+uid).onSnapshot(sn=>{cheer=sn.exists?sn.data():null;if(route==='garden')render()},()=>{});
    db.collection('trees').onSnapshot(q=>{trees=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(route==='common'&&!typing())render()},()=>{});
    db.collection('words').onSnapshot(q=>{words=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(route==='common'&&!typing())render()},()=>{});
    if(isOwner)db.collection('activity').onSnapshot(q=>{
      people=q.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(route==='admin'&&!typing())render();
      if(user)user.profiles(people.map(p=>p.id)).then(ps=>{names=ps;if(route==='admin'&&!typing())render()});
    },()=>{});
  }
  if(room)room.onPeers(ch=>{
    const n=new Set(ch.peers.filter(p=>p.kind==='viewer').map(p=>p.by||p.peer)).size;

/* kinds: r ripe, g still green (round finished below 60%), b bitten (round not finished), p bitten and pulsing (game in progress) */
function fruit(x,y,kind,cls,extra){
  const id='m'+(++gid);
  let body=`<circle cx="${x}" cy="${y}" r="7.2" fill="${kind==='g'?'url(#gGreen)':'url(#gRed)'}"/>`;
  if(kind==='b'||kind==='p')body=`<mask id="${id}"><rect x="${x-10}" y="${y-10}" width="20" height="20" fill="#fff"/><circle cx="${x+7}" cy="${y-2}" r="4.3"/><circle cx="${x+6.4}" cy="${y+3.6}" r="3.3"/></mask><circle cx="${x}" cy="${y}" r="7.2" fill="#fff0cf"/><circle cx="${x}" cy="${y}" r="7.2" fill="url(#gRed)" mask="url(#${id})"/>`;
  return `<g class="apple ${cls||''}${kind==='p'?' pulse':''}" ${extra||''}>${body}<ellipse cx="${x-2.6}" cy="${y-2.8}" rx="2" ry="1.4" fill="#fff" opacity=".5"/><path d="M${x} ${y-6.4}q.6-3.6 3.4-4.6" stroke="#5a3d24" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M${x+1} ${y-9}q4-3.4 7-.6q-3.6 2.6-7 .6Z" fill="#5fae4e"/>${cls==='new'&&kind==='r'?`<circle class="unripe" cx="${x}" cy="${y}" r="7.2" fill="url(#gGreen)"/>`:''}</g>`;
}
function treeSVG(s,o={}){
  const st=stage(s.apples||0),k=[.6,.72,.84,.93,1][st],col=LEAF[s.style]||LEAF[0],cx=120,gy=232,cy=gy-126*k,f1=v=>v.toFixed(1);
  const fr=o.fruits||Array(Math.min(s.apples||0,12)).fill('r'),fl=Math.min(s.flowers||0,8),bf=Math.min(s.waters||0,3);
  let out=`<svg class="tree" viewBox="0 0 240 250" role="img" aria-label="Дерево: яблок ${s.apples||0}, цветов ${s.flowers||0}">`;
  out+=`<ellipse cx="120" cy="${gy+3}" rx="106" ry="13" fill="var(--soil)"/><ellipse cx="120" cy="${gy+2}" rx="${46*k}" ry="6" fill="#000" opacity=".12"/>`;
  for(let i=0;i<9;i++){const x=22+i*24+(i*37%11);out+=`<path d="M${x} ${gy+7}q-2-9-5-11m5 11q0-10 1-13m-1 13q3-8 6-9" stroke="#4f8f3c" stroke-width="1.6" fill="none" stroke-linecap="round"/>`}
  for(let i=0;i<fl;i++){const x=20+i*28+(i%2)*8,y=gy+2+(i%3)*3,c=['#ffffff','#ffd6e4','#fff3b0'][i%3];
    out+=`<path d="M${x} ${y}v9" stroke="#4d8f3f" stroke-width="1.6"/><g fill="${c}">${[0,72,144,216,288].map(a=>`<ellipse cx="${x}" cy="${y-4}" rx="2.6" ry="4" transform="rotate(${a} ${x} ${y})"/>`).join('')}</g><circle cx="${x}" cy="${y}" r="2.4" fill="#f0a92b"/>`}
  out+=`<g class="crown" ${o.click?'data-act="rustle"':''}>`;
  out+=`<path d="M${f1(cx-10*k)} ${gy+2}C${f1(cx-6*k)} ${f1(gy-46*k)} ${f1(cx-6*k)} ${f1(gy-80*k)} ${f1(cx-3*k)} ${f1(cy+8*k)}L${f1(cx+3*k)} ${f1(cy+8*k)}C${f1(cx+5*k)} ${f1(gy-80*k)} ${f1(cx+7*k)} ${f1(gy-46*k)} ${f1(cx+12*k)} ${gy+2}Z" fill="url(#gTrunk)"/>`;
  if(st>0)out+=`<g stroke="#6b4a2f" stroke-width="${f1(5*k)}" fill="none" stroke-linecap="round"><path d="M${f1(cx-2*k)} ${f1(gy-58*k)}Q${f1(cx-20*k)} ${f1(gy-80*k)} ${f1(cx-34*k)} ${f1(cy+16*k)}"/><path d="M${f1(cx+2*k)} ${f1(gy-70*k)}Q${f1(cx+20*k)} ${f1(gy-86*k)} ${f1(cx+34*k)} ${f1(cy+14*k)}"/></g>`;
  BLOBS.slice(0,[3,5,6,8,9][st]).forEach(b=>out+=`<circle cx="${f1(cx+b[0]*k)}" cy="${f1(cy+b[1]*k)}" r="${f1(b[2]*k)}" fill="${col[b[3]]}"/>`);
  out+=`<circle cx="${f1(cx-14*k)}" cy="${f1(cy-22*k)}" r="${f1(30*k)}" fill="#fff" opacity=".1"/>`;
  for(let i=0;i<16;i++){const a=i*2.4,r=(14+i*29%30)*k,x=f1(cx+Math.cos(a)*r*1.1),y=f1(cy+Math.sin(a)*r-4*k);out+=`<ellipse cx="${x}" cy="${y}" rx="5" ry="2.4" fill="${col[2]}" opacity=".75" transform="rotate(${i*47%180} ${x} ${y})"/>`}
  fr.forEach((f,i)=>{const p=SLOTS[i];out+=fruit(+f1(cx+p[0]*k),+f1(cy+p[1]*k),f,(o.fresh&&i===fr.length-1)?'new':'',o.click?`data-act="apple" data-i="${i}" tabindex="0" role="button" aria-label="Плод ${i+1}: показать занятие"`:'')});
  if(o.cur){const p=SLOTS[fr.length%12],sh=fr.length>=12;out+=fruit(+f1(cx+p[0]*k+(sh?6:0)),+f1(cy+p[1]*k-(sh?10:0)),'p','','')}
  if(o.bird){const x=+f1(cx+38*k),y=+f1(cy-40*k);
    out+=`<g class="bird" data-act="bird" tabindex="0" role="button" aria-label="Птица: нажмите, чтобы она что-нибудь сказала"><path d="M${x-8} ${y}l-7-3 1.5 6Z" fill="#35506e"/><ellipse cx="${x}" cy="${y}" rx="8.5" ry="6.2" fill="#f2c14e"/><path d="M${x-7} ${y-1}q6-7 13-1q-6 5-13 1Z" fill="#4a7fb5"/><circle cx="${x+7}" cy="${y-4.5}" r="4.4" fill="#35506e"/><circle cx="${x+8.5}" cy="${y-5.3}" r="1.1" fill="#fff"/><path d="M${x+11} ${y-4.6}l4.5 1-4.5 1.8Z" fill="#e8743b"/></g>`}
  out+='</g>';
  [[34,150,'#f7a1c4'],[204,128,'#8fc7ff'],[190,186,'#ffd166']].slice(0,bf).forEach((b,i)=>out+=`<g class="fly" style="animation-delay:-${i*2.5}s"><g transform="translate(${b[0]} ${b[1]})"><ellipse cx="-3.2" rx="3.6" ry="5" fill="${b[2]}"/><ellipse cx="3.2" rx="3.6" ry="5" fill="${b[2]}"/><path d="M0-4.5v9" stroke="#3b3024" stroke-width="1.2"/></g></g>`);
  return out+'</svg>';
}

function trials(c,T,limit,make){
  let i=0,good=0,lock=false,tm=null;
  const next=()=>{
    if(i===T)return c.done({score:Math.round(good/T*100),err:T-good});
    i++;lock=false;const t=make(i,T);
    const bar=$('.bar i',c.box);
    if(bar){bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${limit}ms linear`;bar.style.width='0%'}
    clearTimeout(tm);tm=setTimeout(()=>{if(!lock)t.answer(null)},limit);
    t.answer=v=>{if(lock)return;lock=true;clearTimeout(tm);const ok=v===t.right;if(ok)good++;t.show(ok,v);c.later(next,ok?450:1100)};
    t.bind(v=>t.answer(v));
  };
  c.stop=()=>clearTimeout(tm);next();
}

function mkSeries(l){
  const a=1+rnd(9);let seq,rule;const gen=f=>range(6).map(f);
  if(l===0){const d=2+rnd(4);seq=gen(i=>a+d*i);rule=`каждое число на ${d} больше предыдущего`}
  else if(l===1){const d=3+rnd(7),s=60+rnd(30);seq=gen(i=>s-d*i);rule=`каждое число на ${d} меньше предыдущего`}
  else if(l===2){if(rnd(2)){const m=2+rnd(2),b=1+rnd(4);seq=gen(i=>b*m**i);rule=`каждое число в ${m} раза больше предыдущего`}
    else{const p=2+rnd(3),q=6+rnd(4);seq=gen(i=>a+Math.ceil(i/2)*p+Math.floor(i/2)*q);rule=`по очереди прибавляется ${p} и ${q}`}}
  else if(l===3){if(rnd(2)){seq=gen(i=>a+i*(i+1)/2);rule='прибавляется 1, потом 2, потом 3 и так далее'}
    else{const b=1+rnd(5);seq=gen(i=>(i+b)**2);rule=`это квадраты чисел подряд, начиная с ${b}×${b}`}}
  else{const v=rnd(3);
    if(v===0){seq=[a,a+1+rnd(4)];while(seq.length<6)seq.push(seq.at(-1)+seq.at(-2));rule='каждое число равно сумме двух предыдущих'}
    else if(v===1){seq=[a];while(seq.length<6)seq.push(seq.at(-1)*2+1);rule='число умножается на 2 и прибавляется 1'}
    else{seq=[a+4];while(seq.length<6)seq.push(seq.length%2?seq.at(-1)*2:seq.at(-1)-3);rule='по очереди: умножить на 2, потом вычесть 3'}}
  const ans=seq[5],opts=new Set([ans]);
  for(const d of shuffle([-3,-2,-1,1,2,3,4,5,-5,10,-10])){if(opts.size===4)break;if(ans+d>0)opts.add(ans+d)}
  return{seq:seq.slice(0,5),ans,rule,opts:shuffle([...opts])};
}

const WMOVES=[['Наполнить A',(x,y,a,b)=>[a,y]],['Наполнить B',(x,y,a,b)=>[x,b]],
  ['Перелить A → B',(x,y,a,b)=>{const t=Math.min(x,b-y);return[x-t,y+t]}],['Перелить B → A',(x,y,a,b)=>{const t=Math.min(y,a-x);return[x+t,y-t]}],
  ['Вылить A',(x,y)=>[0,y]],['Вылить B',(x,y)=>[x,0]]];
function waterSolve(a,b,t){
  const seen=new Map([['0,0',null]]),q=[[0,0]];
  while(q.length){const [x,y]=q.shift();
    if(x===t||y===t){const path=[];let k=x+','+y;while(seen.get(k)){const p=seen.get(k);path.unshift(p.name);k=p.from}return path}
    WMOVES.forEach(([name,f])=>{const [nx,ny]=f(x,y,a,b),k=nx+','+ny;if(!seen.has(k)){seen.set(k,{name,from:x+','+y});q.push([nx,ny])}})}
  return null;
}
game('water','Водный сад','log','Отмерьте нужное количество воды с помощью двух леек.',

  draw();
  $$('.opts button',c.box).forEach(btn=>btn.onclick=()=>{
    const [nx,ny]=WMOVES[+btn.dataset.m][1](x,y,a,b);if(nx===x&&ny===y)return;
    x=nx;y=ny;used++;draw();
    if(x===t||y===t){$$('.opts button',c.box).forEach(q=>q.disabled=true);
      c.later(()=>c.done({score:Math.max(60,100-10*(used-sol.length)),err:0,explain:`Самый короткий путь, ${sol.length} ходов: ${sol.join(', ')}.`}),700)}
    else if(used>=max){$$('.opts button',c.box).forEach(q=>q.disabled=true);
      c.later(()=>c.done({score:0,err:1,explain:`Ходы закончились. Одно из решений, ${sol.length} ходов: ${sol.join(', ')}.`}),500)}
  });

game('mirror','Зеркало','spa','Выберите, как узор будет выглядеть в зеркале.',
 'Слева узор, пунктир обозначает зеркало. Выберите вариант, который получится справа от зеркала. Пять заданий.',c=>{
  const n=[3,3,4,4,5][c.lvl],k=[3,4,6,7,10][c.lvl],R=5;let round=0,good=0;
  const flipH=p=>p.map((_,i)=>p[Math.floor(i/n)*n+(n-1-i%n)]);
  const flipV=p=>p.map((_,i)=>p[(n-1-Math.floor(i/n))*n+i%n]);
  const mut=p=>{const q=[...p],f=range(n*n).filter(i=>q[i]),e=range(n*n).filter(i=>!q[i]);q[f[rnd(f.length)]]=0;q[e[rnd(e.length)]]=1;return q};
  const next=()=>{
    if(round===R)return c.done({score:Math.round(good/R*100),err:R-good});
    round++;let p,right,opts;
    for(let tries=0;tries<80;tries++){
      const on=new Set(pick(range(n*n),k));p=range(n*n).map(i=>on.has(i)?1:0);right=flipH(p);
      const cand=c.lvl>=2?[mut(right),mut(right),flipV(p),p]:[p,flipV(p),flipH(flipV(p)),mut(right)];
      const u=new Map([[right.join(''),right]]);cand.forEach(x=>{if(u.size<4)u.set(x.join(''),x)});
      if(u.size===4){opts=shuffle([...u.values()]);break}
    }
    c.box.innerHTML=`<p class="hint">Задание ${round} из ${R}. Что будет в зеркале?</p><div class="mirror">${miniGrid(p,n)}<span class="axis"></span><span class="q">?</span></div><div class="opts">${opts.map((o,i)=>`<button data-i="${i}" aria-label="Вариант ${'АБВГ'[i]}">${miniGrid(o,n)}</button>`).join('')}</div>`;
    $$('.opts button',c.box).forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.i]===right;
      $$('.opts button',c.box).forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===right)x.classList.add('good')});
      if(ok)good++;else b.classList.add('bad');c.later(next,ok?800:1600);
    });
  };next();
});

function mkSudoku(k){
  const perm=shuffle([1,2,3,4]);let g=[[0,1,2,3],[2,3,0,1],[1,0,3,2],[3,2,1,0]].map(r=>r.map(v=>perm[v]));
  if(rnd(2))[g[0],g[1]]=[g[1],g[0]];if(rnd(2))[g[2],g[3]]=[g[3],g[2]];if(rnd(2))g=[g[2],g[3],g[0],g[1]];if(rnd(2))g=g[0].map((_,c)=>g.map(r=>r[c]));
  const sol=g.flat(),puz=[...sol];
  const count=a=>{const i=a.indexOf(0);if(i<0)return 1;let n=0;const r=i>>2,cc=i&3;
    for(let v=1;v<=4&&n<2;v++){let ok=true;for(let j=0;j<16;j++)if(a[j]===v&&((j>>2)===r||(j&3)===cc||((j>>3)===(r>>1)&&((j&3)>>1)===(cc>>1)))){ok=false;break}
      if(ok){a[i]=v;n+=count(a);a[i]=0}}return n};
  for(const i of shuffle(range(16))){if(puz.filter(v=>!v).length>=k)break;const v=puz[i];puz[i]=0;if(count([...puz])!==1)puz[i]=v}
  return{sol,puz};
}

function illo(id,xl){

  const sq=(x,y,w,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="${w/4}" fill="${f}"/>`;
  const tx=(x,y,sz,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz}" font-weight="700" fill="${K}" font-family="Onest,Arial,sans-serif">${t}</text>`;
  let b='';
  if(id==='leaves')[1,0,0,0,1,0,1,0,0].forEach((v,i)=>b+=sq(6+i%3*18,6+Math.floor(i/3)*18,16,v?L:W));
  else if(id==='seq'){[[20,20,W,'1'],[44,20,Y,'2'],[20,44,W,''],[44,44,W,'3']].forEach(c=>b+=`<circle cx="${c[0]}" cy="${c[1]}" r="10.5" fill="${c[2]}"/>`+tx(c[0],c[1]+4.5,12,c[3]))}
  else if(id==='gone')b=`<circle cx="13" cy="34" r="9" fill="${A}"/><path d="M13 26q1-4 4-5" stroke="${K}" stroke-width="2" fill="none"/><circle cx="51" cy="34" r="9" fill="${Y}"/><circle cx="32" cy="34" r="9" fill="none" stroke="${K}" stroke-width="2.5" stroke-dasharray="4 4"/>`+tx(32,39.5,15,'?');
  else if(id==='schulte')[3,1,4,2].forEach((v,i)=>{const x=8+i%2*26,y=8+Math.floor(i/2)*26;b+=sq(x,y,22,v===1?Y:W)+tx(x+11,y+16,14,v)});
  else if(id==='arrow')b=`<g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 32H6m5-5-5 5 5 5" stroke="${K}"/><path d="M58 32H46m5-5-5 5 5 5" stroke="${K}"/><path d="M24 32h16m-6-6 6 6-6 6" stroke="${A}"/></g>`;
  else if(id==='color')b=`<rect x="5" y="17" width="54" height="30" rx="9" fill="#17211b"/><text x="32" y="37.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ff6b5e" font-family="Onest,Arial,sans-serif">синий</text>`;
  else if(id==='series')b=tx(13,39,17,'2')+tx(28,39,17,'4')+tx(43,39,17,'6')+`<text x="56" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="${A}" font-family="Onest,Arial,sans-serif">?</text>`;
  else if(id==='water')b=`<rect x="12" y="38" width="12" height="15" rx="2" fill="#4aa3d8"/><path d="M10 22v28a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V22" fill="none" stroke="${K}" stroke-width="2.5" stroke-linecap="round"/><rect x="38" y="24" width="16" height="29" rx="2" fill="#4aa3d8"/><path d="M36 12v38a4 4 0 0 0 4 4h12a4 4 0 0 0 4-4V12" fill="none" stroke="${K}" stroke-width="2.5" stroke-linecap="round"/>`;
  else if(id==='mirror')b=sq(5,14,11,L)+sq(5,27,11,L)+sq(18,27,11,L)+sq(5,40,11,W)+sq(18,14,11,W)+sq(18,40,11,W)+`<path d="M32 8v48" stroke="${K}" stroke-width="2" stroke-dasharray="4 4"/>`+sq(48,14,11,L)+sq(48,27,11,L)+sq(35,27,11,L)+sq(48,40,11,W)+sq(35,14,11,W)+sq(35,40,11,W);
  if(!b&&GL[id])b=tx(32,32+GL[id][1]*.36,GL[id][1],GL[id][0]);
  return `<svg class="illo ${GAMES[id].cat}${xl?' xl':''}" viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
}
const tod=()=>{const h=new Date().getHours();return h>=5&&h<11?0:h>=11&&h<17?1:h>=17&&h<21?2:3};

  {sky:['#aee0f5','#f1f8dc'],hill:['#7fb85f','#a8d284'],orb:[325,58,'#ffc53d']},

function scene(tree,extra=''){

}
function calendar(st=S){
  const done=new Set((Array.isArray(st.hist)?st.hist:[]).filter(h=>h.s!=null).map(h=>dayOf(h.at))),now=Date.now();
  return `<div class="cal" role="list" aria-label="Занятия за две недели">${range(14).map(i=>{const t=now-(13-i)*864e5,d=new Date(t),on=done.has(dayOf(t));
    return `<span role="listitem" class="${on?'on':''}${i===13?' now':''}" aria-label="${dm(t)}: ${on?'занятие было':'без занятий'}"><small>${d.toLocaleDateString('ru',{weekday:'short'})}</small>${d.getDate()}<i>${on?'✓':'&nbsp;'}</i></span>`}).join('')}</div>`;
}

function openGame(id){abandon();G={g:GAMES[id],lvl:Math.min(4,S.lv[id]!=null?S.lv[id]:0),active:false,run:0};route='play';render();window.scrollTo(0,0)}
function startGame(){
  G.active=true;G.t0=Date.now();G.run++;const my=G.run,g=G.g;
  if(speaking)say('');S.cur={g:g.id,l:G.lvl,at:G.t0};save();
  $('#main').innerHTML=`<section class="card"><div class="row between"><h2>${esc(g.name)}</h2><button data-act="quit">Выйти из игры</button></div><p class="mut">Уровень ${G.lvl+1} из 5</p><div id="box" class="list"></div></section>`;
  const ctx={lvl:G.lvl,box:$('#box'),later:(f,ms)=>setTimeout(()=>{if(G&&G.run===my&&G.active)f()},ms),done:r=>{if(G&&G.run===my&&G.active){if(ctx.stop)ctx.stop();finish(r)}}};
  G.ctx=ctx;g.run(ctx);
}
function markDay(){if(S.lastDay!==DAY()){S.days++;S.lastDay=DAY()}}
function finish(r){
  G.active=false;document.onkeydown=null;
  const d=Math.max(1,Math.round((Date.now()-G.t0)/1000)),ok=r.score>=60,id=G.g.id;
  S.hist.push({g:id,l:G.lvl,at:G.t0,d,s:r.score,ok});if(S.hist.length>200)S.hist=S.hist.slice(-200);
  S.sec+=d;S.cur=null;markDay();
  if(ok){S.apples++;S.lv[id]=Math.max(S.lv[id]||0,G.lvl);newApple=true}
  save();G.res=Object.assign({d,ok,msg:(ok?OKP:NOP)[rnd(ok?OKP.length:NOP.length)]},r);render();
}
function abandon(){
  if(G&&G.active){G.active=false;document.onkeydown=null;if(G.ctx&&G.ctx.stop)G.ctx.stop();
    S.hist.push({g:G.g.id,l:G.lvl,at:G.t0,d:Math.round((Date.now()-G.t0)/1000),s:null,ok:false});S.cur=null;save()}
  G=null;
}

   <p class="small mut">Здесь видны только имя дерева, яблоки и цветы. Игры, результаты и время занятий другим участникам не показываются.</p></section>
  <section class="card"><h2>Добрые слова</h2><p class="mut">Оставьте пожелание другим садовникам. У каждого одно пожелание, его можно менять.</p>
   ${ws.length?`<div class="list">${ws.map(w=>`<div class="word"><p>${esc(w.text.slice(0,140))}<br><span class="small mut">${esc(nickOf(w.id))}${w.id===uid?' · это вы':''}</span></p>${w.id===uid||isOwner?`<button data-act="worddel" data-id="${esc(w.id)}">Убрать</button>`:''}</div>`).join('')}</div>`:'<p class="mut">Пока никто ничего не написал. Ваше пожелание может стать первым.</p>'}
   ${canWrite?`<div class="chips">${WISHES.map((w,i)=>`<button data-act="wish" data-i="${i}">${w}</button>`).join('')}</div>
   <div class="row"><label for="word" class="small mut" style="flex-basis:100%">Или напишите своими словами</label><input type="text" id="word" maxlength="140" data-in="word" value="${esc(wordDraft)}"><button class="pri" data-act="wordsend">Оставить пожелание</button></div><p id="wordmsg" class="small mut" role="status">${esc(wordMsg)}</p>`:'<p class="small mut">Писать пожелания могут участники в режиме «Аккаунт», посадившие дерево.</p>'}</section>`;
}
function pstat(p){
  const h=Array.isArray(p.hist)?p.hist:[],now=Date.now(),ok=h.filter(x=>x.ok);
  const on=online.has(p.id),playing=on&&!!p.cur;
  return{on,playing,today:ok.filter(x=>dayOf(x.at)===DAY()).length,week:ok.filter(x=>now-x.at<7*864e5).length,month:ok.filter(x=>now-x.at<30*864e5).length,last:h.filter(x=>x.s!=null).at(-1),h};
}
const pname=p=>esc(p.nick||'Без имени')+(names[p.id]&&names[p.id].name?` <span class="mut small">(${esc(names[p.id].name)})</span>`:'');
function adminDetail(p,s){
  const c=p.cur,id=esc(p.id);
  return `<div class="card" style="background:var(--bg)"><h3>${pname(p)} <span class="pill ${s.playing?'play':s.on?'on':''}">${s.playing?'играет':s.on?'онлайн':'не в сети'}</span></h3>
  ${scene(treeSVG(p,{fruits:fruitsOf(p),cur:!!c}))}
  <p>${c?(s.on?'Играет: ':'Начато и не завершено: ')+`«${esc(gname(c.g))}», уровень ${c.l+1} из 5, начало: ${when(c.at)}`:'Сейчас не играет.'}</p>
  <div class="tiles"><div class="tile"><b>${s.today}</b><span>сегодня</span></div><div class="tile"><b>${s.week}</b><span>за неделю</span></div><div class="tile"><b>${s.month}</b><span>за месяц</span></div><div class="tile"><b>${+p.apples||0}</b><span>спелых яблок</span></div><div class="tile"><b>${+p.days||0}</b><span>дней с практикой</span></div><div class="tile"><b>${Math.round((+p.sec||0)/60)} мин</b><span>в упражнениях</span></div></div>
  <p>Последний результат: ${s.last?`${s.last.s}% в «${esc(gname(s.last.g))}»`:'пока нет'}. Последний визит: ${when(p.seen)}.${p.hidden?' Дерево скрыто из общего сада.':''}</p>
  <h3>Две недели</h3>${calendar(p)}
  <h3>По упражнениям</h3>${gameTable(p)}
  <h3>Награды</h3>${awardsHTML(p)}
  <h3>Последние занятия</h3>
  ${s.h.length?`<div class="scroll"><table><thead><tr><th>Когда</th><th>Упражнение</th><th>Уровень</th><th>Время</th><th>Результат</th></tr></thead><tbody>${s.h.slice(-15).reverse().map(x=>`<tr><td>${when(x.at)}</td><td>${esc(gname(x.g))}</td><td>${x.l+1}</td><td>${x.d?dur(x.d):'—'}</td><td>${x.s==null?'не доиграно':x.s+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Занятий пока не было.</p>'}
  <h3>Ободрить участника</h3><p class="small mut">Ваши слова появятся в его саду.</p>
  <div class="chips">${CHEERS.map((t,i)=>`<button data-act="cheer" data-i="${i}">${t}</button>`).join('')}</div>
  <div class="row"><label for="cheer" class="small mut" style="flex-basis:100%">Или своими словами</label><input type="text" id="cheer" maxlength="140" style="flex:1 1 220px"><button class="pri" data-act="cheersend" data-id="${id}">Отправить</button></div><p class="small mut" role="status">${esc(cheerMsg)}</p>
  <div class="row">${confirmDel===p.id?`<span>Удалить дерево и все результаты участника?</span><button class="danger" data-act="delyes" data-id="${id}">Да, удалить</button><button data-act="delno">Отмена</button>`:`<button class="danger" data-act="delask" data-id="${id}">Удалить участника</button>`}</div></div>`;
}
function vAdmin(){
  if(!isOwner)return `<section class="card"><h2>Панель администратора</h2><p>Этот раздел открыт только владельцу сада.</p></section>`;
  const st=people.map(p=>[p,pstat(p)]);
  const tiles=`<div class="tiles"><div class="tile"><b>${people.length}</b><span>участников</span></div><div class="tile"><b>${st.filter(x=>x[1].on).length}</b><span>онлайн сейчас</span></div><div class="tile"><b>${st.filter(x=>x[1].playing).length}</b><span>играют сейчас</span></div><div class="tile"><b>${st.reduce((a,x)=>a+x[1].today,0)}</b><span>яблок за сегодня</span></div></div>`;
  const tabs=`<div class="chips">${[['live','Живой сад'],['list','Участники'],['hist','История занятий']].map(t=>`<button data-act="atab" data-t="${t[0]}" aria-pressed="${adminTab===t[0]}">${t[1]}</button>`).join('')}</div>`;
  let body='';
  if(!people.length)body=`<p class="mut">Пока никто не посадил дерево в режиме «Аккаунт». Участники появятся здесь сразу после посадки.</p>`;
  else if(adminTab==='live'){
    body=`<div class="trees">${st.map(([p,s])=>`<button class="tcard${s.playing?' glow':''}" data-act="sel" data-id="${esc(p.id)}" aria-pressed="${sel===p.id}">${treeSVG(p,{cur:!!p.cur,fruits:fruitsOf(p)})}<b>${esc(p.nick||'Без имени')}</b><span class="pill ${s.playing?'play':s.on?'on':''}">${s.playing?'играет':s.on?'онлайн':'не в сети'}</span></button>`).join('')}</div>`;
    const f=st.find(x=>x[0].id===sel);
    if(f){const [p,s]=f,c=p.cur;
      body+=adminDetail(p,s)}
  }else if(adminTab==='list'){
    body=`<div class="scroll"><table><thead><tr><th>Участник</th><th>Статус</th><th>Сегодня</th><th>Неделя</th><th>Месяц</th><th>Яблок</th><th>Последний визит</th></tr></thead><tbody>${st.map(([p,s])=>`<tr><td>${pname(p)}</td><td>${s.playing?'играет: '+esc(gname(p.cur.g)):s.on?'онлайн':'не в сети'}</td><td>${s.today}</td><td>${s.week}</td><td>${s.month}</td><td>${+p.apples||0}</td><td>${when(p.seen)}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button data-act="csv">Скопировать таблицу как CSV</button><span id="copied" class="small mut" role="status"></span></div>`;
  }else{
    const all=st.flatMap(([p,s])=>s.h.map(x=>[p,x])).sort((a,b)=>b[1].at-a[1].at).slice(0,60);
    body=all.length?`<div class="scroll"><table><thead><tr><th>Когда</th><th>Участник</th><th>Упражнение</th><th>Уровень</th><th>Результат</th></tr></thead><tbody>${all.map(([p,x])=>`<tr><td>${when(x.at)}</td><td>${esc(p.nick||'Без имени')}</td><td>${esc(gname(x.g))}</td><td>${x.l+1}</td><td>${x.s==null?'не завершено':x.s+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Занятий пока не было.</p>';
  }
  return `<section class="card"><h2>Панель Ромы</h2><p class="mut">Данные приходят из базы и обновляются без перезагрузки. Гости в режиме «Без сохранения» сюда не попадают.</p>${tiles}${tabs}${body}</section>`;
}
function vPrefs(){
  const ui=getUI();
  const m=(v,t,d,dis)=>`<label class="radio"><input type="radio" name="mode" id="m_${v}" value="${v}" data-in="mode" ${mode===v?'checked':''} ${dis?'disabled':''}><span><b>${t}</b><br><span class="small mut">${d}</span></span></label>`;
  return `<section class="card"><h2>Как сохранять занятия</h2><fieldset><legend class="small mut">Режим</legend>
    ${m('account','Аккаунт',accountOK?'Дерево и история хранятся в облаке и открываются с телефона и компьютера. Владелец сада видит ваши занятия.':'Недоступно: нужно войти в Claude и получить доступ к странице с правом участия.',!accountOK)}
    ${m('device','На этом устройстве','Данные остаются только в этом браузере и никуда не отправляются.')}
    ${m('nosave','Без сохранения','Результаты исчезнут, когда вы закроете страницу. В панели администратора вас не видно.')}</fieldset></section>
  <section class="card"><h2>Моё дерево</h2>
    <div class="row"><label for="nick2">Имя</label><input type="text" id="nick2" maxlength="24" value="${esc(S.nick)}"><button data-act="rename">Сохранить имя</button></div>
    <div class="row"><label for="style">Вид дерева</label><select id="style" data-in="style">${STYLE_NAMES.map((n,i)=>`<option value="${i}" ${S.style===i?'selected':''}>${n}</option>`).join('')}</select></div>
    <label class="radio"><input type="checkbox" id="hidden" data-in="hidden" ${S.hidden?'checked':''}><span><b>Скрыть дерево из общего сада</b><br><span class="small mut">Дерево останется в вашем саду и в панели администратора.</span></span></label></section>
  <section class="card"><h2>Удобство</h2>
    <label class="radio"><input type="checkbox" id="big" data-in="big" ${ui.big?'checked':''}><span><b>Крупный текст</b></span></label>
    <label class="radio"><input type="checkbox" id="still" data-in="still" ${ui.still?'checked':''}><span><b>Отключить анимацию</b></span></label></section>
  <section class="card"><h2>Удаление данных</h2><p>Удаляются дерево, история и все результаты в текущем режиме.</p>
    <div class="row">${confirmDel==='me'?`<span>Удалить всё без возможности вернуть?</span><button class="danger" data-act="wipeyes">Да, удалить</button><button data-act="delno">Отмена</button>`:`<button class="danger" data-act="wipeask">Удалить мои данные</button>`}</div></section>`;
}
const ROUTES={garden:['Мой сад',vGarden],games:['Упражнения',vGames],progress:['Прогресс',vProgress],common:['Общий сад',vCommon],admin:['Панель Ромы',vAdmin],prefs:['Настройки',vPrefs]};
function render(){
  $('#nav').innerHTML=Object.entries(ROUTES).filter(([k])=>k!=='admin'||isOwner).map(([k,v])=>`<a href="#${k}" ${route===k?'aria-current="page"':''}>${v[0]}</a>`).join('');
  $('#main').innerHTML=route==='play'&&G?vPlay():(ROUTES[route]||ROUTES.garden)[1]();
  if(route!=='garden')notice='';
}
function go(){wordMsg='';bubble='';cheerMsg='';if(speaking)say('');abandon();const h=location.hash.slice(1);route=ROUTES[h]?h:'garden';appleSel=null;confirmDel=null;render()}
window.addEventListener('hashchange',go);

/* ---------- actions ---------- */
function copy(text){const s=$('#copied');const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text):Promise.reject();
  p.then(()=>{if(s)s.textContent='Скопировано'}).catch(()=>{if(s)s.textContent='Браузер не разрешил копирование'})}
const ACT={
  big(){const ui=getUI();ui.big=!ui.big;lsSet('ng_ui',JSON.stringify(ui));applyUI(ui);if(route==='prefs')render()},
  plant(){const v=$('#nick').value.trim().slice(0,24);if(!v){$('#nick').focus();return}S.nick=v;save();if(room)room.presence({acc:mode==='account'?1:null}).catch(()=>{});render()},
  rename(){const v=$('#nick2').value.trim().slice(0,24);if(!v)return;S.nick=v;save();render()},
  open(e){openGame(e.dataset.g)},
  lvl(e){G.lvl=+e.dataset.l;render()},
  start(){startGame()},
  again(){G.res=null;startGame()},
  nextlvl(){G.res=null;G.lvl=Math.min(4,G.lvl+1);startGame()},
  explain(){const x=$('#expl');if(x)x.hidden=false},
  quit(){abandon();go()},
  home(){G=null;if(location.hash==='#garden'||location.hash==='')go();else location.hash='garden'},
  apple(e){appleSel=+e.dataset.i;render()},
  atab(e){adminTab=e.dataset.t;render()},
  sel(e){sel=sel===e.dataset.id?null:e.dataset.id;confirmDel=null;cheerMsg='';render()},
  delask(e){confirmDel=e.dataset.id;render()},
  delno(){confirmDel=null;render()},
  async delyes(e){const id=e.dataset.id;confirmDel=null;sel=null;try{await db.doc('activity/'+id).delete();await db.doc('trees/'+id).delete()}catch(x){}render()},
  wipeask(){confirmDel='me';render()},
  async wipeyes(){confirmDel=null;
    if(mode==='account'){try{await db.doc('activity/'+uid).delete();await db.doc('trees/'+uid).delete()}catch(x){}}
    if(mode==='device')lsSet('ng_state',null);
    S=blank();housekeeping();lastTree='';if(room)room.presence({acc:null}).catch(()=>{});location.hash='garden';go()},
  wish(e){wordDraft=WISHES[+e.dataset.i];const w=$('#word');if(w){w.value=wordDraft;w.focus()}},
  async wordsend(){const t=($('#word')?$('#word').value:wordDraft).trim().slice(0,140);if(!t){if($('#word'))$('#word').focus();return}
    try{await db.doc('words/'+uid).set({text:t,at:Date.now()});wordDraft='';wordMsg='Пожелание опубликовано.'}catch(x){wordMsg='Не получилось отправить пожелание. Попробуйте ещё раз чуть позже.'}
    render()},
  async worddel(e){try{await db.doc('words/'+e.dataset.id).delete();wordMsg=''}catch(x){wordMsg='Не получилось убрать пожелание.'}render()},
  say(e){say(e.dataset.text,e)},
  catf(e){catF=e.dataset.c;render()},
  rustle(e){
    const sc=e.closest('.scene'),still=document.documentElement.classList.contains('still');
    e.classList.remove('shake');void e.getBoundingClientRect();e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),700);
    if(sc&&!still)for(let i=0;i<7;i++){const l=document.createElement('i');l.className='fall';l.style.left=(30+rnd(40))+'%';l.style.setProperty('--dx',(rnd(120)-60)+'px');l.style.animationDelay=(i*90)+'ms';sc.appendChild(l);setTimeout(()=>l.remove(),3000)}
  },
  water(){
    if(S.water===DAY())return;S.water=DAY();S.waters=(S.waters||0)+1;save();
    const sc=$('.scene'),still=document.documentElement.classList.contains('still');
    if(sc&&!still)for(let i=0;i<16;i++){const d=document.createElement('i');d.className='drop';d.style.left=(22+rnd(56))+'%';d.style.animationDelay=(i*60)+'ms';sc.appendChild(d)}
    bubble='Дерево напоено. Спасибо за заботу!'+(S.waters<=3?' К дереву прилетела бабочка.':'');
    setTimeout(()=>{if(route==='garden')render()},still?0:1500);
  },
  bird(){bubble=BIRD[rnd(BIRD.length)];render()},
  async thanks(){cheer=null;render();try{await db.doc('cheers/'+uid).delete()}catch(x){}},
  cheer(e){const i=$('#cheer');if(i){i.value=CHEERS[+e.dataset.i];i.focus()}},
  async cheersend(e){const i=$('#cheer'),t=i?i.value.trim().slice(0,140):'';if(!t){if(i)i.focus();return}
    try{await db.doc('cheers/'+e.dataset.id).set({text:t,at:Date.now()});cheerMsg='Отправлено. Участник увидит ваши слова в своём саду.'}catch(x){cheerMsg='Не получилось отправить. Попробуйте ещё раз.'}
    render()},
  copymine(){copy(JSON.stringify({nick:S.nick,apples:S.apples,flowers:S.flowers,days:S.days,history:S.hist.map(h=>({game:gname(h.g),level:h.l+1,date:new Date(h.at).toISOString(),seconds:h.d,score:h.s}))},null,1))},
  csv(){copy(['Участник;Сегодня;Неделя;Месяц;Яблок;Последний визит'].concat(people.map(p=>{const s=pstat(p);return[String(p.nick||'').replace(/;/g,','),s.today,s.week,s.month,+p.apples||0,p.seen?new Date(p.seen).toISOString():''].join(';')})).join('\n'))}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target)}
  if(e.key==='Enter'&&e.target.id==='nick')ACT.plant()});
document.addEventListener('input',e=>{if(e.target.dataset.in==='word'){wordDraft=e.target.value;return}
  if(e.target.dataset.in==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{const k=e.target.dataset.in;if(!k||k==='search'||k==='word')return;
  if(k==='mode'){await setMode(e.target.value);render()}
  if(k==='style'){S.style=+e.target.value;save()}
  if(k==='hidden'){S.hidden=e.target.checked;save()}
  if(k==='big'||k==='still'){const ui=getUI();ui[k]=e.target.checked;lsSet('ng_ui',JSON.stringify(ui));applyUI(ui)}
});
const h0=location.hash.slice(1);route=ROUTES[h0]?h0:'garden';render();
init().catch(()=>{ready=true;render()});
</script>
</body>
</html>
